name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Project ini nol dependency, jadi tidak ada go.sum. Tanpa baris ini
          # setup-go mencari go.sum untuk cache dan memunculkan peringatan.
          cache: false

      - name: Pastikan nol dependency eksternal
        run: make check-deps

      - name: Cek format
        run: make fmt

      - name: go vet
        run: make vet

      - name: Jalankan test
        run: go test -v ./...

      - name: Build binary
        run: make build

      - name: Pastikan .env tidak ikut ter-commit
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "❌ .env ikut ter-commit — token bisa bocor!"
            exit 1
          fi
          echo "✅ .env tidak ada di repository"

  cross-compile:
    name: Cross-compile ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, arm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build untuk linux/${{ matrix.goarch }}
        run: make release ARCH=${{ matrix.goarch }} OS=linux
