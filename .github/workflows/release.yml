name: Release

# Membangun binary di GitHub, lalu menerbitkannya sebagai Release.
#
# Kenapa di GitHub dan bukan di VPS:
#   - VPS spek rendah (RAM 512MB) sering gagal/kehabisan memori saat
#     mengompilasi Go.
#   - VPS tidak perlu memasang Go toolchain sama sekali.
#   - Binary hasil GitHub konsisten: yang diuji di CI sama dengan yang dipasang.
#
# Alur pakai:
#   git tag v1.0.0 && git push origin v1.0.0
# Lalu di Telegram: /update

on:
  push:
    tags:
      - 'v*'
  # Bisa dijalankan manual untuk menguji tanpa membuat tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Rilis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # Test dulu — jangan sampai merilis binary yang rusak.
      - name: Jalankan test
        run: go test ./...

      # Matriks arsitektur. Tambahkan di sini bila perlu arsitektur lain;
      # update_dl.go akan otomatis mencari nama yang cocok.
      - name: Bangun binary
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64 arm 386; do
            echo "🔨 linux/$arch"
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w" -o "dist/core_engine-linux-$arch" .
          done
          ls -lh dist

      # Checksum memungkinkan bot memverifikasi unduhan tidak rusak/diutak-atik.
      - name: Buat checksum
        run: |
          cd dist
          sha256sum core_engine-linux-* > SHA256SUMS
          cat SHA256SUMS

      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/core_engine-linux-*
            dist/SHA256SUMS
          # Catatan rilis diambil dari pesan tag (git tag -a), bukan ditulis
          # ulang di sini. Body statis pernah menimpa catatan fitur dari tag,
          # sehingga halaman rilis hanya menampilkan cara pasang dan tidak
          # menyebut apa yang berubah. generate_release_notes pun dimatikan:
          # daftar commit otomatis tidak boleh menggantikan catatan yang sudah
          # disusun di tag.
          body: |
            ${{ github.event.release.body }}

            ---

            ## Pemasangan

            ```sh
            sudo env BOT_TOKEN=TOKENMU ADMIN_IDS=USERIDMU \
              sh -c "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh)"
            ```

            Atau update dari dalam bot Telegram: `/update`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
